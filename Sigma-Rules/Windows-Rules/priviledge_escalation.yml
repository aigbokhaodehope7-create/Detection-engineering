title: Windows User Added to Privileged Group
id: 7c2e9a41-5d83-4f16-b290-8a6d3e7f1254
status: experimental
description: Detects users added to sensitive Windows security groups.
author: Hope - HopeLabs Detection Engineering
date: 2026-11-06

logsource:
    product: windows
    service: security

detection:
    selection_event:
        EventID:
            - 4728
            - 4732
            - 4756

    selection_group:
        TargetUserName:
            - 'Administrators'
            - 'Domain Admins'
            - 'Enterprise Admins'
            - 'Schema Admins'
            - 'Backup Operators'

    condition: selection_event and selection_group

falsepositives:
    - Approved administrator account provisioning
    - Legitimate IT group membership changes

level: high

tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1098
