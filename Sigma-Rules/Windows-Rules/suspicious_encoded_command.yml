title: Suspicious Windows Command Prompt Execution
id: 6b2d9f41-8c73-4a15-b290-5e7c3d1f6248
status: experimental
description: >
    Detects selected Windows command-line utilities and commands
    that may be used for system discovery or suspicious activity.
author: Hope - HopeLabs Detection Engineering
date: 2026-11-06

logsource:
    product: windows
    category: process_creation

detection:
    selection_image:
        Image|endswith: '\cmd.exe'

    selection_commands:
        CommandLine|contains:
            - 'whoami'
            - 'systeminfo'
            - 'net user'
            - 'net group'
            - 'ipconfig'
            - 'tasklist'
            - 'net localgroup'
            - 'nltest'

    condition: selection_image and selection_commands

falsepositives:
    - Legitimate system administration
    - IT troubleshooting
    - Approved security assessments

level: medium

tags:
    - attack.discovery
    - attack.t1059.003
