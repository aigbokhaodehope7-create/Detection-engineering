title: Windows Failed Logon Attempt
id: 6a9d3f21-8c42-4e75-a1b6-2d9f7c5e3108
status: experimental
description: Detects failed Windows authentication attempts using Security Event ID 4625.
author: Hope - HopeLabs Detection Engineering
date: 2026-11-06

logsource:
    product: windows
    service: security

detection:
    selection:
        EventID: 4625

    condition: selection

falsepositives:
    - Users entering incorrect passwords
    - Expired passwords
    - Misconfigured applications

level: medium

tags:
    - attack.credential_access
    - attack.t1110
