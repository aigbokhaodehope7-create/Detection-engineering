title: Suspicious Hidden PowerShell Execution
id: 9a4c2e71-6d83-4f15-b290-3c8e7d5f6142
status: experimental
description: >
    Detects PowerShell processes launched with hidden window
    options that may indicate stealthy execution.
author: Hope - HopeLabs Detection Engineering
date: 2026-11-06

logsource:
    product: windows
    category: process_creation

detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_hidden:
        CommandLine|contains:
            - '-WindowStyle Hidden'
            - '-w hidden'
            - '-window hidden'

    condition: selection_image and selection_hidden

falsepositives:
    - Legitimate background administrative scripts
    - Approved automation tools
    - Software deployment scripts

level: high

tags:
    - attack.execution
    - attack.defense_evasion
    - attack.t1059.001
