title: Schtasks Task Creation With Autostart Trigger In Privileged Or Suspicious Context
id: c755a31e-8e23-4b50-8776-3442b38aa100
related:
    - id: 3e6280e2-8626-4c6d-9c9b-f6f80856b59d
      type: similar
status: experimental
description: |
    Detects schtasks.exe creating a scheduled task that runs at logon, at startup or when idle, and that
    either runs as SYSTEM or executes a command interpreter, script host, living-off-the-land binary or a
    program from a user-writable location. This is the process-creation companion to the Security 4698 rule
    and still alerts when task-creation auditing is disabled or the 4698 event is missing. It also records
    failed attempts, which Windows 4698 events do not.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://learn.microsoft.com/sysinternals/downloads/sysmon
    - Internal lab report - Persistence Detection Laboratory Report (9 November 2026)
author: Aigbokhaode Hope Imomoh
date: 2026-11-10
tags:
    - attack.persistence
    - attack.execution
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\schtasks.exe'
        - OriginalFileName: 'schtasks.exe'
    selection_create:
        CommandLine|windash|contains: ' -create '
    selection_autostart:
        CommandLine|windash|contains:
            - ' -sc onlogon'
            - ' -sc onstart'
            - ' -sc onidle'
    selection_privileged:
        CommandLine|windash|contains:
            - ' -ru system'
            - ' -ru "system"'
            - ' -ru nt authority\system'
            - ' -ru "nt authority\system"'
    selection_payload:
        CommandLine|contains:
            - 'cmd.exe'
            - 'cmd /c'
            - 'powershell'
            - 'pwsh'
            - 'wscript'
            - 'cscript'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - '\Users\Public\'
            - '\AppData\'
            - '\Temp\'
            - 'http://'
            - 'https://'
    filter_optional_vendor_tasks:
        CommandLine|contains:
            - '\Microsoft\Windows\'
            - '\GoogleUpdate'
            - '\MicrosoftEdgeUpdate'
    condition: selection_img and selection_create and selection_autostart and (selection_privileged or selection_payload) and not 1 of filter_optional_*
fields:
    - CommandLine
    - ParentImage
    - ParentCommandLine
    - User
    - LogonId
falsepositives:
    - Software installers and updaters that register autostart tasks from the command line
    - Administrator scripts and configuration-management tooling
    - Add exclusions by parent process (for example approved deployment agents), not by broad command-line text
level: high
