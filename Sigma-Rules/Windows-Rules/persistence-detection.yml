title: Windows Scheduled Task Created With Autostart Trigger And Privileged Or Suspicious Action
id: 3e6280e2-8626-4c6d-9c9b-f6f80856b59d
status: experimental
description: |
    Detects creation of a Windows scheduled task (Security event 4698) that is set to start automatically
    (at logon or at boot) AND either runs as SYSTEM or highest privileges, or launches a command interpreter,
    script host, living-off-the-land binary or a program from a user-writable path.
    Attackers use such tasks for persistence (T1053.005). Requires the audit subcategory
    "Other Object Access Events" (Success) to be enabled; without it event 4698 is never written.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - Internal lab report - Persistence Detection Laboratory Report (9 November 2026)
author: Aigbokhaode Hope Imomoh
date: 2026-11-10
tags:
    - attack.persistence
    - attack.execution
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    product: windows
    service: security
detection:
    selection_event:
        EventID: 4698
    selection_autostart:
        TaskContent|contains:
            - '<LogonTrigger>'
            - '<BootTrigger>'
            - '&lt;LogonTrigger&gt;'
            - '&lt;BootTrigger&gt;'
    selection_privileged:
        TaskContent|contains:
            - '<UserId>S-1-5-18</UserId>'
            - '<UserId>SYSTEM</UserId>'
            - '<UserId>NT AUTHORITY\SYSTEM</UserId>'
            - '<RunLevel>HighestAvailable</RunLevel>'
            - '&lt;UserId&gt;S-1-5-18&lt;/UserId&gt;'
    selection_payload:
        TaskContent|contains:
            - 'cmd.exe'
            - 'cmd /c'
            - 'powershell'
            - 'pwsh'
            - 'wscript'
            - 'cscript'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - '\Users\Public\'
            - '\AppData\'
            - '\Temp\'
            - 'http://'
            - 'https://'
    filter_optional_vendor_tasks:
        TaskName|startswith:
            - '\Microsoft\Windows\'
            - '\Microsoft\Office\'
            - '\Microsoft\VisualStudio\'
    condition: selection_event and selection_autostart and (selection_privileged or selection_payload) and not 1 of filter_optional_*
fields:
    - TaskName
    - SubjectUserName
    - SubjectDomainName
    - SubjectLogonId
    - TaskContent
falsepositives:
    - Legitimate software installers and endpoint management tools that register autostart tasks running as SYSTEM
    - Administrators deploying maintenance scripts (validate the task name, author and change ticket)
    - Attackers can imitate vendor task paths (for example \Microsoft\Windows\), so review the filter list periodically
level: high
