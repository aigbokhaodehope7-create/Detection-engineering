title: Suspicious Windows Service Installed (Command Interpreter Or User-Writable Path)
id: 3fac8b76-d66a-41de-8f72-735da3a067c3
status: experimental
description: |
    Detects installation of a new Windows service (System event 7045, Service Control Manager) whose
    image path points to a command interpreter, script host, living-off-the-land binary or a user-writable
    directory. Legitimate services run dedicated service executables, so cmd.exe or PowerShell as a
    service image is a strong persistence and privilege-escalation indicator (T1543.003). The service
    does not need to start successfully; the installation event is the detection point.
references:
    - https://attack.mitre.org/techniques/T1543/003/
    - Internal lab report - Persistence Detection Laboratory Report (9 November 2026)
author: Aigbokhaode Hope Imomoh
date: 2026-11-10
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1543.003
logsource:
    product: windows
    service: system
detection:
    selection_event:
        Provider_Name: 'Service Control Manager'
        EventID: 7045
    selection_image:
        ImagePath|contains:
            - 'cmd.exe'
            - 'cmd /c'
            - 'powershell'
            - 'pwsh'
            - 'wscript'
            - 'cscript'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - '\Users\Public\'
            - '\AppData\'
            - '\Temp\'
            - '\ProgramData\'
    condition: selection_event and selection_image
fields:
    - ServiceName
    - ImagePath
    - ServiceType
    - StartType
    - AccountName
falsepositives:
    - Some software installers briefly register services from temporary or ProgramData folders
    - Remote administration and deployment tools that use a command wrapper (confirm with the change record)
level: high
---
title: Registry Run Key Modified By Scripting Tool Or With Suspicious Payload
id: 6a117e7e-8b1d-4556-9a1e-02d4b2a08682
status: experimental
description: |
    Detects a value being set under a Run or RunOnce autostart key (Sysmon event 13) by a command-line or
    scripting tool (reg.exe, PowerShell, cmd, script hosts and similar) OR where the value launches a
    command interpreter or a program from a user-writable path. Run keys execute programs at user logon and
    are a common persistence mechanism (T1547.001). Detects both reg.exe and PowerShell writers.
references:
    - https://attack.mitre.org/techniques/T1547/001/
    - https://learn.microsoft.com/sysinternals/downloads/sysmon
    - Internal lab report - Persistence Detection Laboratory Report (9 November 2026)
author: Aigbokhaode Hope Imomoh
date: 2026-11-10
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection_key:
        TargetObject|contains:
            - '\CurrentVersion\Run\'
            - '\CurrentVersion\RunOnce\'
            - '\CurrentVersion\Policies\Explorer\Run\'
    selection_writer:
        Image|endswith:
            - '\reg.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\wmic.exe'
    selection_payload:
        Details|contains:
            - 'cmd.exe'
            - 'powershell'
            - 'pwsh'
            - 'wscript'
            - 'cscript'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - '\Users\Public\'
            - '\AppData\'
            - '\Temp\'
            - 'http://'
            - 'https://'
    filter_optional_onedrive:
        Details|contains: '\Microsoft\OneDrive\OneDrive.exe'
    filter_optional_edge:
        Image|endswith: '\msedge.exe'
        Details|contains: '\Microsoft\Edge\Application\msedge.exe'
    condition: selection_key and (selection_writer or selection_payload) and not 1 of filter_optional_*
fields:
    - TargetObject
    - Details
    - Image
    - User
    - ProcessId
falsepositives:
    - Software installers and administrative scripts that add legitimate autostart entries with reg.exe or PowerShell
    - Per-user applications installed under AppData (OneDrive is filtered; other apps may need exclusions after review)
level: high
