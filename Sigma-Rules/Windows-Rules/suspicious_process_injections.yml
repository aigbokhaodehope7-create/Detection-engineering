title: Suspicious Process Access and Injection Activity
id: 7c4e9a21-5d83-4f16-b290-8a6d3e7f1254
status: experimental
description: >
    Detects selected Sysmon process access events that may
    indicate suspicious process injection activity.
author: Hope - HopeLabs Detection Engineering
date: 2026-11-06

logsource:
    product: windows
    category: process_access

detection:
    selection:
        GrantedAccess|contains:
            - '0x1FFFFF'
            - '0x1F0FFF'
            - '0x143A'
            - '0x1F3FFF'

    condition: selection

falsepositives:
    - Legitimate debugging tools
    - Endpoint security software
    - Approved system administration utilities

level: high

tags:
    - attack.defense_evasion
    - attack.privilege_escalation
    - attack.t1055
