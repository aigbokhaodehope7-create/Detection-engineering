title: Suspicious PowerShell Encoded Execution
id: 8f3d1c72-5b9a-4e61-9c24-7a2d6f0b1e85
status: experimental
description: Detects PowerShell launched with encoded commands.
author: Hope - HopeLabs Detection Engineering
date: 2026-11-06

logsource:
    category: process_creation
    product: windows

detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_command:
        CommandLine|contains:
            - '-EncodedCommand'
            - '-enc '

    condition: selection_image and selection_command

falsepositives:
    - Legitimate administrative automation

level: high

tags:
    - attack.execution
    - attack.t1059.001
