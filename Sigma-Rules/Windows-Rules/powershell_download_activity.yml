title: Suspicious PowerShell File Download
id: 1d7a9c42-5e83-4b61-a290-6f3c8d5e7124
status: experimental
description: >
    Detects PowerShell commands using common download methods
    that may be used to retrieve malicious files.
author: Hope - HopeLabs Detection Engineering
date: 2026-11-06

logsource:
    product: windows
    category: process_creation

detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_download:
        CommandLine|contains:
            - 'DownloadFile'
            - 'DownloadString'
            - 'Invoke-WebRequest'
            - 'iwr '
            - 'Start-BitsTransfer'

    condition: selection_image and selection_download

falsepositives:
    - Legitimate software downloads
    - Approved administrative scripts
    - System maintenance automation

level: high

tags:
    - attack.command_and_control
    - attack.t1105
    - attack.execution
    - attack.t1059.001
